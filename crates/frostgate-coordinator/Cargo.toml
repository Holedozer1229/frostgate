[package]
name = "frostgate-coordinator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Frostgate coordinator service: peg-in watcher -> FROST signing session -> ZEC release"

[[bin]]
name = "frostgate-coordinator"
path = "src/main.rs"

[dependencies]
frostgate-federation = { path = "../frostgate-federation" }
frostgate-bitcoin = { path = "../frostgate-bitcoin" }
frostgate-zcash = { path = "../frostgate-zcash" }
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
