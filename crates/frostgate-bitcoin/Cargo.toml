[package]
name = "frostgate-bitcoin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bitcoin leg of Frostgate: Taproot federation key, key-spend sighash, Esplora peg-in watcher"

[dependencies]
frostgate-federation = { path = "../frostgate-federation" }
bitcoin = "0.32"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
rand = "0.8"
